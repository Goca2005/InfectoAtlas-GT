name: Revisar InfectoAtlas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npx --yes pnpm@11.19.0 install --frozen-lockfile --ignore-scripts
      - run: npx --yes pnpm@11.19.0 run lint
      - run: npx --yes pnpm@11.19.0 test
      - run: npx --yes pnpm@11.19.0 run build
